apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-mysql-initdb
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS notification_db;

    USE notification_db;

    CREATE TABLE IF NOT EXISTS notifications (
        id INT AUTO_INCREMENT PRIMARY KEY,
        user_id INT NOT NULL,
        title VARCHAR(255) NOT NULL,
        message TEXT NOT NULL,
        type VARCHAR(50) NOT NULL,
        `read` BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        read_at TIMESTAMP NULL,
        INDEX idx_user_id (user_id),
        INDEX idx_type (type),
        INDEX idx_read (`read`)
    );
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-mysql-secret
type: Opaque
data:
  mysql-root-password: cm9vdHBhc3N3b3Jk  # base64 encoded "rootpassword"
  mysql-password: bm90aWZpY2F0aW9ucGFzcw==  # base64 encoded "notificationpass"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-mysql
  labels:
    app: notification-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-mysql
  template:
    metadata:
      labels:
        app: notification-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: notification_db
        - name: MYSQL_USER
          value: notificationuser
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-mysql-secret
              key: mysql-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        - name: mysql-initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: notification-mysql-pvc
      - name: mysql-initdb
        configMap:
          name: notification-mysql-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: notification-mysql
  labels:
    app: notification-mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: notification-mysql
