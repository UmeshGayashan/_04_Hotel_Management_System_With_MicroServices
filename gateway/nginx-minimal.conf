worker_processes  1;

events { worker_connections 1024; }

http {
  sendfile on;
  client_max_body_size 10m;

  map $http_origin $cors_allow_origin {
    default "*";  # TODO: set to specific origin(s) in prod
  }

  server {
    listen 80;

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    set $proxy_host_header $host;

    # Ensure upstream CORS headers don't duplicate ours
    proxy_hide_header Access-Control-Allow-Origin;

    # CORS helper
    set $cors_methods "GET,POST,PUT,PATCH,DELETE,OPTIONS";
    set $cors_headers "Authorization,Content-Type,Idempotency-Key";

    # Allow CORS for localhost:3000
    if ($http_origin ~* "http://localhost:3000") {
      set $cors_allow_origin $http_origin;
    }

    # Notification service (works now)
    location /api/v1/notifications/ {
      # Normalize trailing slash to match FastAPI route without slash
      rewrite ^/api/v1/notifications/$ /api/v1/notifications break;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin;
        add_header Access-Control-Allow-Methods $cors_methods;
        add_header Access-Control-Allow-Headers $cors_headers;
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_allow_origin always;
      proxy_set_header Host $proxy_host_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://notification-service:8005;
    }

    # Notification service health via gateway
    location = /api/v1/notifications/health {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin;
        add_header Access-Control-Allow-Methods $cors_methods;
        add_header Access-Control-Allow-Headers $cors_headers;
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_allow_origin always;
      proxy_set_header Host $proxy_host_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://notification-service:8005/health;
    }

    # Also handle /api/v1/notifications without trailing slash
    location = /api/v1/notifications {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin;
        add_header Access-Control-Allow-Methods $cors_methods;
        add_header Access-Control-Allow-Headers $cors_headers;
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_allow_origin always;
      proxy_set_header Host $proxy_host_header;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://notification-service:8005/api/v1/notifications;
    }

    # WebSocket for notifications (direct proxy)
    location /ws/ {
      proxy_pass http://notification-service:8005;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback for missing services - return 503 instead of crashing
    location /api/v1/auth/ {
      return 503 "Auth service not available";
      add_header Content-Type text/plain;
    }

    location /api/v1/services/ {
      return 503 "Hotel service not available";
      add_header Content-Type text/plain;
    }

    location /api/v1/bookings/ {
      return 503 "Booking service not available";
      add_header Content-Type text/plain;
    }

    location /api/v1/payments/ {
      return 503 "Payment service not available";
      add_header Content-Type text/plain;
    }
  }
}
